name: Update Sentinel prices

on:
  schedule:
    # GitHub Actions uses UTC.
    - cron: "0 6 * * *"

  # Allows you to run it immediately from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sentinel-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch Sentinel prices
        run: python scripts/fetch_sentinel_prices.py

      - name: Commit updated price data
        run: |
          git add data/sentinel-prices.json

          if git diff --cached --quiet; then
            echo "No price changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Sentinel pricing data"
          git push
